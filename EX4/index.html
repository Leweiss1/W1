<!DOCTYPE html>
<html>

<head>
    <title>Table</title>
    <style>
        table,
        th,
        td {
            border: 2px solid black;
            border-collapse: collapse;
            padding: 8px 16px;
        }

        table {
            margin: 200px auto;
        }

        th {
            background-color: antiquewhite;
        }
    </style>
</head>

<body>
    <h1 style="position: absolute; top: 100px; left: 50%;">TABLE</h1>
    <table>
        <tr>
            <th>Product Name</th>
            <th>Price</th>
            <th>Quality</th>
            <th>In Stock</th>
        </tr>
        <tr>
            <td>C# Book</td>
            <td>$10</td>
            <td>5</td>
            <td>yes</td>
        </tr>
        <tr>
            <td>C++ primer plus sixth edition</td>
            <td>75$</td>
            <td>100</td>
            <td>yes</td>
        </tr>
        <tr>
            <td>HTML black book</td>
            <td>60$</td>
            <td>20</td>
            <td>yes</td>
        </tr>
    </table>
</body>

</html>
